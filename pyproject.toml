[project]
name = "wannarun"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.0.55",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "pwdlib[argon2]>=0.3.1",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
